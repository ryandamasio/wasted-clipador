# Configurações gerais do Clipador. Caminhos relativos à raiz do projeto.

paths:
  data_dir: data
  recordings_dir: data/recordings
  clips_dir: data/clips
  output_dir: data/output
  models_dir: data/models
  logs_dir: data/logs
  db_path: data/clipador.sqlite

capture:
  poll_interval_seconds: 60        # intervalo para checar quem está online
  max_concurrent: 3                # lives gravadas ao mesmo tempo
  segment_seconds: 120             # tamanho de cada arquivo de gravação (menor = clipe pronto mais rápido)
  quality: "best"                  # qualidade do streamlink
  chat_offset_seconds: 7           # atraso médio da reação do chat em relação ao vídeo capturado (calibrado 14/11)
  reconnect_delay_seconds: 15
  max_reconnect_attempts: 20
  twitch_disable_ads: true
  kick_low_latency: false
  browser_executable: auto         # auto | caminho do chrome/edge (Kick exige navegador p/ desafio JS)
  record_chat: true
  retention_hours: 12              # apaga gravações brutas após X horas se já processadas
  min_free_gb: 20                  # pausa captura se o disco ficar abaixo disso
  plan_b:                          # captura de tela quando streamlink E yt-dlp falham (Kick bloqueando, etc.)
    enabled: true                  # VB-Cable instalado em 14/11 (precisa de reinício do Windows para o dispositivo aparecer)
    force: false                   # true = usa sempre a tela (teste)
    after_failures: 2              # falhas rápidas seguidas antes de cair para a tela
    region: {x: 0, y: 0, w: 1920, h: 1080}   # região/monitor onde o navegador kiosk abre e é capturado
    audio_device: "CABLE Output (VB-Audio Virtual Cable)"   # dshow loopback (healthcheck lista os nomes)
    route_audio: true              # durante o plano B: saída padrão -> CABLE Input, com "ouvir" nos alto-falantes; restaura ao sair
    cable_input: "CABLE Input"     # nomes usados pelo SoundVolumeView (tools/SoundVolumeView.exe)
    cable_output: "CABLE Output"
    fps: 30
    bitrate: "6M"
    encoder: h264_nvenc            # fallback: libx264
    open_browser: true             # abre o Chrome em kiosk na região (perfil próprio em data/browser_profile)
    browser_warmup_seconds: 12
  backup_db_hours: 24              # cópia do SQLite em data/backups (mantém 7)

detect:
  window_seconds: 8                # janela deslizante de pontuação
  step_seconds: 1
  min_score: 50                    # nota mínima (0-100) para virar momento (calibrado 14/11: p99 de lives calmas ~45)
  min_score_no_chat: 62            # quando o segmento não tem chat (rerun, chat bloqueado): só áudio+fala+keywords -> exige mais
  max_moments_per_segment: 2      # clipes de 1 min+: no máximo 2 por segmento de 2 min
  max_moments_per_hour: 6          # teto por live; acima disso só passa nota >= always_keep_score (evita inundar a fila em evento)
  always_keep_score: 70
  min_gap_seconds: 75              # distância mínima entre picos (clipes longos não podem repetir o trecho)
  weights:                         # soma = 1.0
    chat: 0.50
    audio: 0.20
    transcript: 0.15
    keywords: 0.15
  chat:
    baseline_minutes: 10           # média móvel para comparar a velocidade do chat
    min_burst_rate: 1.5            # msgs/s (suavizado em 5 s) para uma rajada contar como explosão total; chats grandes passam fácil
    hype_tokens: ["kkk", "kkkk", "kkkkk", "hahaha", "????", "?????", "pqp", "caralho", "mano", "nao acredito", "não acredito", "que isso", "meu deus", "mds", "nossa", "lul", "kekw", "omegalul", "pog", "pogchamp", "lets go", "vamo", "insano", "brabo", "bugou", "rip", "clip", "clipa", "clipem", "clipador", "momento", "lendario", "lendário", "absurdo", "gg", "ez"]
  audio:
    rms_window_seconds: 0.5
  whisper:
    model: "small"                 # small | medium (medium cabe em 6 GB com int8_float16, mais lento)
    device: "cuda"                 # cuda | cpu
    compute_type: "int8_float16"   # p/ cuda; cpu usa int8 automaticamente
    language: "pt"
    beam_size: 2
    vad_filter: true
  clip:                            # >= 1 min: TikTok só paga vídeo acima de 1 min (pedido do dono, 18/11)
    min_seconds: 62
    max_seconds: 95
    target_seconds: 72
    pre_roll_seconds: 6            # um pouco de contexto antes do pico (o clipe longo precisa de começo, meio e fim)
    dedupe_overlap: 0.5            # momentos com sobreposição > isso são considerados iguais
  keywords:                        # contexto GTA 6 / eventos do jogo (bônus de pontuação)
    - gta
    - gta 6
    - gta seis
    - rockstar
    - polícia
    - policia
    - perseguição
    - perseguicao
    - fugir
    - fuga
    - bateu
    - batida
    - capotou
    - explodiu
    - explosão
    - assalto
    - roubo
    - roubar
    - banco
    - helicóptero
    - helicoptero
    - avião
    - aviao
    - easter egg
    - gráfico
    - grafico
    - física
    - fisica
    - realista
    - bug
    - bugou
    - glitch
    - lucia
    - jason
    - leonida
    - vice city
    - morreu
    - matei
    - morri
    - wasted
    - estrela
    - procurado
  blocklist_words: ["estupr", "nazis", "hitler", "viado", "macaco", "preto fedido", "retardad", "suicid", "se mata"]   # nota x0.4: conteúdo problemático
  sensitive_words: ["aborto", "bolsonaro", "lula", "política", "politica", "religião", "religiao", "pedof", "racis", "homofob", "transfob"]   # nota x0.7: temas que podem prejudicar o streamer
  llm:
    enabled: false                 # requer ANTHROPIC_API_KEY no .env
    model: "claude-haiku-5-5"
    min_score_to_call: 40          # só chama o LLM para janelas já promissoras (economia)

edit:
  width: 1080
  height: 1920
  fps: 30
  video_bitrate: "8M"
  max_bitrate: "12M"
  encoder: "h264_nvenc"            # fallback automático para libx264
  nvenc_preset: "p5"
  audio_bitrate: "192k"
  loudnorm: "I=-14:TP=-1.5:LRA=11"
  background: "blur"               # blur | black
  subtitles:
    font_name: "Arial"             # fonte do sistema (libass via DirectWrite) — troque por fonte em assets/fonts
    font_size: 78
    bold: true
    primary_color: "&H00FFFFFF"    # branco (ASS: &HAABBGGRR)
    highlight_color: "&H0000FFFF"  # amarelo
    outline_color: "&H00000000"
    outline: 5
    shadow: 1
    max_words_per_line: 3
    max_line_seconds: 1.8
    uppercase: true
  credit:
    enabled: true
    template: "Clipe: {display}"
    font_file: "C:/Windows/Fonts/arialbd.ttf"
    font_size: 34
  watermark:
    enabled: true
    file: assets/watermark/watermark.png   # se não existir, é ignorada
    opacity: 0.6
    width: 220
    position: "top-right"          # top-left | top-right
  center_crop: 0.7                 # mantém 70% centrais da largura: gameplay ocupa ~45% da tela vertical (antes 32%)
  zoom:                            # punch-in nos picos de áudio: entra rápido, segura, sai suave
    enabled: true
    amount: 0.16                   # 16% de aproximação no pico
    attack_seconds: 0.15           # entrada (rápida = "punch")
    hold_seconds: 0.5
    width_seconds: 0.9             # saída suave
    max_per_clip: 3
    min_gap_seconds: 4
  facecam_max_height: 760          # altura máxima da facecam no layout dividido (px)
  split_shift_up: 60               # desloca o conjunto facecam+gameplay para cima (deixa a legenda sobre o gameplay)
  long_version:                    # clip_long.mp4 extra; desligado desde 18/11 porque todo clipe já tem >= 1 min
    enabled: false
    networks: [tiktok]
    min_seconds: 62
    target_seconds: 75
    max_seconds: 95
  music:                           # só na versão clip_youtube.mp4; clip.mp4 fica sem música (TikTok/Instagram)
    enabled: true
    dir: assets/music_free         # faixas livres + LICENSES.md (sem faixas -> sem versão com música)
    target_lufs: -27               # loudness da música antes do ducking (voz fica em -14: música ~13 dB abaixo)
    volume_db: 0                   # ajuste fino extra (dB)
    duck_threshold: 0.03           # sidechain: abaixa a música quando há voz
    duck_ratio: 6

copy:
  profile_name: "Cortes GTA 6"
  profile_handle: "@cortesgta6"     # TODO ajustar quando criar as contas
  language: "pt-BR"
  title_max_chars: 70

review:
  enabled: true                    # sobe a fila de aprovação junto com `clipador run`
  host: 0.0.0.0                    # acessível na rede local (celular no mesmo Wi-Fi): http://IP-do-PC:8787
  port: 8787
  tunnel: true                     # abre https://xxxx.trycloudflare.com (precisa de cloudflared e REVIEW_PASSWORD no .env)
  auto_approve_min_score: null     # ex.: 85 para auto-aprovar; null = desligado
  purge_after_hours: 72            # apaga a pasta de saída de clipes rejeitados/substituídos após X h (null = nunca)

publish:
  mode: manual                     # manual: a fila só agenda e você posta pelo app | auto: publica via API nas redes com `via`
  windows: ["11:30-13:30", "17:30-19:30", "20:30-23:00"]   # janelas de postagem (hora local do PC)
  posts_per_day: 3                 # por rede, depois do aquecimento
  max_posts_per_day: 5
  warmup_ramp: [2, 2, 2, 3, 3, 3, 4]   # posts/dia nos primeiros dias de cada rede (conta nova); depois posts_per_day
  min_gap_minutes: 90              # espaçamento mínimo entre posts da mesma rede
  cross_network_offset_minutes: [8, 35]   # mesmo clipe em redes diferentes: defasagem aleatória nesse intervalo
  jitter_minutes: [3, 12]          # atraso aleatório mínimo após a aprovação
  max_clip_age_hours: 36           # só informa no log quando a vaga ficar mais longe que isso
  retry_backoff_minutes: [5, 20, 60, 180]   # tentativas após falha (erros definitivos não repetem)
  publish_poll_seconds: 60
  networks:                        # via: api (API oficial) | upload-post (serviço único) | manual
    youtube:   {enabled: true, via: api, privacy: public, category_id: "20", made_for_kids: false, set_thumbnail: false}
    tiktok:    {enabled: true, via: api, privacy_level: SELF_ONLY, disable_duet: false, disable_stitch: false, disable_comment: false}
    instagram: {enabled: true, via: api, share_to_feed: true}
    kwai:      {enabled: true, via: manual}
  upload_post:
    user: ""                       # nome do perfil no painel do Upload-Post (se usar via: upload-post)
