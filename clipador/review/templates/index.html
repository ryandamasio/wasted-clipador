<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>WASTED · {{ profile }}</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262a33; --txt:#e8eaef; --mut:#8b93a5; --ok:#22c55e; --no:#ef4444; --warn:#f59e0b; --acc:#60a5fa; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding-bottom:40px; }
  header { position:sticky; top:0; z-index:5; background:rgba(15,17,21,.95); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0; }
  header h1 { font-size:17px; margin:0 0 8px; display:flex; justify-content:space-between; align-items:center; }
  header h1 small { color:var(--mut); font-weight:400; font-size:12px; }
  .tabs { display:flex; gap:4px; overflow-x:auto; }
  .tabs button { flex:1; background:none; border:0; border-bottom:2px solid transparent; color:var(--mut); padding:8px 6px; font-size:14px; white-space:nowrap; }
  .tabs button.on { color:var(--txt); border-color:var(--acc); }
  .tabs button b { background:var(--line); border-radius:10px; padding:0 7px; margin-left:4px; font-size:12px; }
  main { max-width:560px; margin:0 auto; padding:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:16px; overflow:hidden; }
  .vid { background:#000; display:flex; justify-content:center; }
  .vid video { max-height:62vh; width:100%; object-fit:contain; display:block; }
  .meta { padding:10px 12px 0; display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; color:var(--mut); font-size:13px; }
  .score { font-weight:700; font-size:15px; padding:2px 9px; border-radius:9px; color:#000; background:var(--warn); }
  .score.hi { background:var(--ok); } .score.lo { background:#94a3b8; }
  .notes { padding:4px 12px 0; font-size:13px; color:var(--txt); }
  .notes span { background:var(--line); border-radius:7px; padding:2px 8px; margin:2px 4px 2px 0; display:inline-block; }
  details { padding:6px 12px 0; font-size:13px; color:var(--mut); }
  details summary { cursor:pointer; color:var(--acc); }
  details pre { white-space:pre-wrap; word-break:break-word; margin:6px 0 0; font:inherit; color:var(--txt); }
  .titles { padding:10px 12px 0; }
  .titles label { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .titles input[type=text], textarea, select { width:100%; background:#0f1115; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  textarea { min-height:92px; resize:vertical; }
  .nets { padding:6px 12px 0; }
  .net { border-top:1px solid var(--line); padding:8px 0; }
  .net h4 { margin:0 0 6px; font-size:13px; display:flex; justify-content:space-between; align-items:center; text-transform:capitalize; }
  .net h4 button { font-size:12px; padding:4px 10px; }
  .acts { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:12px; }
  .acts .wide { grid-column:1 / -1; }
  button { cursor:pointer; border:0; border-radius:10px; padding:12px 10px; font:inherit; font-weight:600; background:var(--line); color:var(--txt); }
  button.ok { background:var(--ok); color:#06220f; } button.no { background:var(--no); color:#fff; }
  button.ghost { background:transparent; border:1px solid var(--line); }
  button:disabled { opacity:.45; cursor:default; }
  .panel { padding:0 12px 12px; display:none; }
  .panel.on { display:block; }
  .row { display:flex; gap:6px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  .row b { min-width:40px; color:var(--mut); font-weight:500; font-size:13px; }
  .row button { padding:8px 0; min-width:46px; flex:0 0 auto; }
  .row .val { min-width:40px; text-align:center; font-variant-numeric:tabular-nums; }
  .row .ok { padding:10px 14px; }
  .empty { text-align:center; color:var(--mut); padding:50px 10px; }
  .toast { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:#222a38; color:#fff; padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; }
  .toast.on { opacity:1; }
  .links { padding:0 12px 10px; font-size:13px; display:flex; gap:12px; flex-wrap:wrap; }
  .links a { color:var(--acc); text-decoration:none; }
  .stats { font-size:12px; color:var(--mut); padding:6px 12px 14px; text-align:center; }
  .badge { font-size:11px; padding:1px 7px; border-radius:7px; background:var(--line); color:var(--mut); }
  .post { display:grid; grid-template-columns:72px 1fr; gap:10px; padding:12px; }
  .post img { width:72px; height:128px; object-fit:cover; border-radius:8px; background:#000; }
  .post .ph { width:72px; height:128px; border-radius:8px; background:#000; }
  .post h3 { margin:0 0 4px; font-size:14px; }
  .post .when { font-size:13px; color:var(--mut); }
  .post .when.due { color:var(--warn); font-weight:600; }
  .net-tag { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:7px; color:#000; margin-right:6px; }
  .net-youtube { background:#ff4d4d; } .net-tiktok { background:#69f0e0; } .net-instagram { background:#f5a3ff; } .net-kwai { background:#ffb15c; }
  .post .cap { margin-top:6px; font-size:12px; color:var(--mut); max-height:3.6em; overflow:hidden; white-space:pre-wrap; }
  .post .err { color:var(--no); font-size:12px; margin-top:4px; }
  .pacts { grid-column:1 / -1; display:flex; gap:8px; flex-wrap:wrap; }
  .pacts button { padding:9px 12px; font-size:13px; }
  .banner { margin:0 0 12px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:13px; color:var(--mut); }
  .urlrow { grid-column:1 / -1; display:none; gap:8px; }
  .urlrow.on { display:flex; }
  .urlrow input { flex:1; }
  .kpis { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:12px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; }
  .kpi b { display:block; font-size:22px; }
  .kpi span { font-size:12px; color:var(--mut); }
  .kpi.warn b { color:var(--warn); } .kpi.bad b { color:var(--no); } .kpi.good b { color:var(--ok); }
  table.t { width:100%; border-collapse:collapse; font-size:13px; margin-bottom:12px; }
  table.t th, table.t td { text-align:left; padding:6px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.t th { color:var(--mut); font-weight:500; font-size:12px; }
  .tw { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px 8px; margin-bottom:12px; }
  .sec { font-size:13px; color:var(--mut); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.04em; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--acc); }
</style>
</head>
<body>
<header>
  <h1><span><span style="color:var(--no);letter-spacing:.08em">WASTED</span> <small>{{ profile }} · fila de aprovação</small></span><small id="pend"></small></h1>
  <div class="tabs" id="tabs">
    <button data-s="ready" class="on">Pendentes<b id="n-ready">0</b></button>
    <button data-s="approved">Aprovados<b id="n-approved">0</b></button>
    <button data-s="rejected">Rejeitados<b id="n-rejected">0</b></button>
    <button data-s="agenda">Agenda<b id="n-agenda">0</b></button>
    <button data-s="posted">Postados<b id="n-posted">0</b></button>
    <button data-s="all">Todos</button>
    <button data-s="painel">Painel</button>
  </div>
</header>
<main id="list"><div class="empty">carregando…</div></main>
<div class="stats" id="stats"></div>
<div class="toast" id="toast"></div>

<script>
const REJECT = {{ reject_reasons | tojson }};
const NETS = { youtube: "YouTube", tiktok: "TikTok", instagram: "Instagram", kwai: "Kwai" };
let status = "ready", clips = [], busy = false;

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg, ms = 2200) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), ms); }

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("erro " + r.status));
  return j;
}

async function load() {
  try {
    if (status === "agenda") {
      const j = await api(`/api/posts`);
      posts = j.posts; publishInfo = j.publish; renderPosts(); renderStats(j.stats); return;
    }
    if (status === "painel") { renderMetrics(await api(`/api/metrics?days=7`)); return; }
    const j = await api(`/api/clips?status=${status}`);
    clips = j.clips; render(); renderStats(j.stats);
  } catch (e) { $("#list").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

let posts = [], publishInfo = {};
const NET_NAMES = { youtube: "YouTube", tiktok: "TikTok", instagram: "Instagram", kwai: "Kwai" };

function postCard(p) {
  const manual = p.publisher === "manual";
  const acts = [];
  if (p.status === "scheduled" || p.status === "posting") {
    if (manual) acts.push(`<button class="ok" data-p="posted">✓ Já postei</button>`);
    else acts.push(`<button class="ok" data-p="now">🚀 Postar agora</button>`);
    acts.push(`<button class="ghost" data-p="reschedule">⏱ Reagendar</button>`, `<button class="ghost" data-p="skip">Pular</button>`);
  } else if (p.status === "failed") {
    acts.push(`<button class="ok" data-p="retry">↻ Tentar de novo</button>`, `<button class="ghost" data-p="posted">Marcar postado</button>`, `<button class="ghost" data-p="skip">Pular</button>`);
  } else if (p.status === "processing") {
    acts.push(`<span class="badge">processando na plataforma…</span>`);
  }
  return `<article class="card post-card" data-pid="${p.id}"><div class="post">
    ${p.has_cover ? `<img src="/media/${p.clip_id}/cover.jpg" alt="">` : `<div class="ph"></div>`}
    <div>
      <div><span class="net-tag net-${p.platform}">${NET_NAMES[p.platform] || p.platform}</span><span class="badge">${manual ? "manual" : p.publisher}</span> <span class="badge">nota ${p.score}</span></div>
      <h3>${esc(p.title)}</h3>
      <div class="when ${p.due ? "due" : ""}">${p.due ? "⏰ agora: " : ""}${esc(p.when)} · ${esc(p.streamer_name)}${p.attempts > 1 ? ` · tentativa ${p.attempts}` : ""}</div>
      <div class="cap">${esc(p.caption)}</div>
      ${p.error ? `<div class="err">${esc(p.error)}</div>` : ""}
      ${p.url ? `<div><a href="${esc(p.url)}" target="_blank" style="color:var(--acc);font-size:13px">${esc(p.url)}</a></div>` : ""}
    </div>
    <div class="pacts">
      <button class="ghost" data-p="copy">📋 copiar texto</button>
      <a href="/media/${p.clip_id}/${p.video_name}" download><button class="ghost">⬇ vídeo</button></a>
      ${acts.join("")}
    </div>
    <div class="urlrow"><input type="text" class="purl" placeholder="link do post (opcional)"><button class="ok" data-p="posted-go">Confirmar</button></div>
  </div></article>`;
}

function renderPosts() {
  const el = $("#list");
  const mode = publishInfo.mode === "auto" ? "automático" : "manual";
  const nets = Object.entries(publishInfo.networks || {}).map(([n, i]) => `${NET_NAMES[n] || n}: ${i.manual ? "manual" : (i.configured ? "API ok" : "API não configurada")}`).join(" · ");
  const banner = `<div class="banner">Modo <b>${mode}</b> · ${esc(nets)}<br>Janelas: ${(publishInfo.windows || []).join(", ")}. ${mode === "manual" ? "Poste pelo app da rede no horário sugerido e toque em \"Já postei\"." : "Redes manuais ainda dependem de você."}</div>`;
  if (!posts.length) { el.innerHTML = banner + `<div class="empty">Nada agendado. Aprove clipes para entrar na agenda.</div>`; return; }
  el.innerHTML = banner + posts.map(postCard).join("");
}

function renderMetrics(m) {
  const h = m.health, c = m.counts || {};
  const total = Object.values(c).reduce((a, b) => a + b, 0);
  const decided = (c.approved || 0) + (c.posted || 0) + (c.rejected || 0);
  const rate = decided ? Math.round(100 * ((c.approved || 0) + (c.posted || 0)) / decided) : null;
  const kpi = (v, label, cls = "") => `<div class="kpi ${cls}"><b>${v}</b><span>${label}</span></div>`;
  const backlog = (h.backlog.to_detect || 0) + (h.backlog.detecting || 0);
  let html = `<div class="kpis">
    ${kpi(h.live.length, h.live.length ? "ao vivo: " + h.live.map(l => l.streamer).join(", ") : "nenhuma live agora", h.live.length ? "good" : "")}
    ${kpi(total, "clipes produzidos")}
    ${kpi(rate === null ? "–" : rate + "%", "aprovação (" + decided + " decididos)", rate === null ? "" : rate >= 60 ? "good" : "warn")}
    ${kpi(m.latency && m.latency.n ? m.latency.avg_min + " min" : "–", "momento → clipe (média)", m.latency && m.latency.avg_min > 10 ? "warn" : "good")}
    ${kpi(backlog, "segmentos na fila do Whisper", backlog > 3 ? "warn" : "")}
    ${kpi((h.pending.new || 0) + (h.pending.waiting || 0) + (h.pending.editing || 0), "momentos p/ renderizar")}
    ${kpi(h.disk_free_gb + " GB", "livres em disco (" + h.recordings_gb + " GB de gravações)", h.disk_free_gb < 40 ? "bad" : "")}
    ${kpi(h.gpu ? h.gpu.util + "%" : "–", h.gpu ? `GPU · ${h.gpu.mem_used}/${h.gpu.mem_total} MB · ${h.gpu.temp}°C` : "GPU indisponível")}
    ${kpi(h.publish_mode, "publicação · plano B " + (h.plan_b ? "ligado" : "desligado"))}
  </div>`;
  html += `<div class="sec">últimos ${m.days} dias</div><div class="tw"><table class="t"><tr><th>dia</th><th>clipes</th><th>aprovados</th><th>rejeitados</th><th>postados</th></tr>`;
  html += (m.per_day || []).map(d => `<tr><td>${d.day}</td><td>${d.clips}</td><td>${d.approved || 0}</td><td>${d.rejected || 0}</td><td>${d.posted || 0}</td></tr>`).join("") || `<tr><td colspan="5" style="color:var(--mut)">sem clipes no período</td></tr>`;
  html += `</table></div>`;
  html += `<div class="sec">por streamer</div><div class="tw"><table class="t"><tr><th>streamer</th><th>lives</th><th>segs</th><th>momentos</th><th>clipes</th><th>✓</th><th>✗</th><th>nota média</th></tr>`;
  html += (m.per_streamer || []).map(s => `<tr><td>${esc(s.streamer)}</td><td>${s.streams}</td><td>${s.segments}</td><td>${s.moments}</td><td>${s.clips}</td><td>${s.approved || 0}</td><td>${s.rejected || 0}</td><td>${s.avg_score || "–"}</td></tr>`).join("");
  html += `</table></div>`;
  html += `<div class="sec">decisões por nota</div><div class="tw"><table class="t"><tr><th>faixa</th><th>aprovados</th><th>rejeitados</th><th>recortes</th><th>taxa</th></tr>`;
  html += (m.reviews || []).map(r => { const d = r.approved + r.rejected; const pct = d ? Math.round(100 * r.approved / d) : 0;
    return `<tr><td>${r.band}</td><td>${r.approved}</td><td>${r.rejected}</td><td>${r.recut}</td><td style="min-width:120px"><div class="bar"><i style="width:${pct}%"></i></div>${d ? pct + "%" : ""}</td></tr>`; }).join("") || `<tr><td colspan="5" style="color:var(--mut)">ainda sem decisões</td></tr>`;
  html += `</table></div>`;
  html += `<div class="sec">posts</div><div class="tw"><table class="t"><tr><th>rede</th><th>agendados</th><th>postados</th><th>falhos</th><th>views</th><th>likes</th></tr>`;
  html += (m.posts || []).map(p => { const v = (m.views || {})[p.platform] || {}; return `<tr><td>${NET_NAMES[p.platform] || p.platform}</td><td>${p.scheduled || 0}</td><td>${p.posted || 0}</td><td>${p.failed || 0}</td><td>${v.views ?? "–"}</td><td>${v.likes ?? "–"}</td></tr>`; }).join("") || `<tr><td colspan="6" style="color:var(--mut)">nenhum post ainda</td></tr>`;
  html += `</table></div><div class="stats">último backup do banco: ${h.last_backup || "nenhum"} · gerado ${m.generated_at}</div>`;
  $("#list").innerHTML = html;
}

function renderStats(st) {
  const c = st.counts || {};
  for (const k of ["ready", "approved", "rejected", "posted"]) $("#n-" + k).textContent = c[k] || 0;
  const ps = st.posts || {};
  $("#n-agenda").textContent = (ps.scheduled || 0) + (ps.failed || 0) + (ps.posting || 0);
  $("#pend").textContent = [st.pending_moments ? `${st.pending_moments} renderizando…` : "", st.posts_due ? `${st.posts_due} post(s) na hora` : ""].filter(Boolean).join(" · ");
  const rows = (st.by_score || []).map(b => `${b.band}: ${b.approved}✓ ${b.rejected}✗ ${b.recut}✂`).join(" · ");
  $("#stats").textContent = rows ? "decisões por nota — " + rows : "";
}

function scoreClass(s) { return s >= 70 ? "hi" : s >= 55 ? "" : "lo"; }

function card(c) {
  const titles = c.titles.map((t, i) => `<label><input type="radio" name="t${c.id}" value="${i}" ${t === c.chosen_title ? "checked" : ""}><input type="text" data-i="${i}" value="${esc(t)}"></label>`).join("");
  const nets = Object.entries(c.networks).map(([n, d]) => `
    <div class="net" data-net="${n}"><h4>${NETS[n] || n}<button class="ghost" data-copy="${n}">copiar</button></h4>
      <input type="text" class="nt" value="${esc(d.title)}" style="margin-bottom:6px">
      <textarea class="nd">${esc(d.description)}</textarea></div>`).join("");
  const comps = Object.entries(c.components).filter(([, v]) => v != null).map(([k, v]) => `${k} ${Math.round(v * 100)}%`).join(" · ");
  const ready = c.status === "ready";
  const acts = ready ? `
      <button class="ok" data-a="approve">✓ Aprovar</button>
      <button class="no" data-a="reject">✗ Rejeitar</button>
      <button class="ghost" data-a="recut-panel" ${c.media_available ? "" : "disabled title='gravação bruta já apagada'"}>✂ Ajustar corte</button>
      <button class="ghost" data-a="reedit" ${c.media_available ? "" : "disabled"}>↻ Re-editar</button>`
    : c.status === "approved" ? `
      <button class="ok wide" data-a="posted">📤 Marcar como postado</button>
      <button class="ghost" data-a="reject">✗ Rejeitar</button><button class="ghost" data-a="restore">↩ Voltar p/ fila</button>`
    : c.status === "rejected" ? `<button class="ghost wide" data-a="restore">↩ Voltar para a fila</button>`
    : `<span class="badge">${esc(c.status)}</span>`;
  return `<article class="card" data-id="${c.id}">
    <div class="vid"><video controls playsinline preload="metadata" ${c.has_cover ? `poster="/media/${c.id}/cover.jpg"` : ""} src="/media/${c.id}/clip.mp4"></video></div>
    <div class="meta"><span class="score ${scoreClass(c.score)}">${c.score}</span><b>${esc(c.streamer_name)}</b><span>${c.duration}s</span><span>${c.when}</span>
      <span class="badge">${esc(c.render.layout || "center")}${c.render.zoom && c.render.zoom.length ? " · zoom×" + c.render.zoom.length : ""}${c.recut_count ? " · recorte " + c.recut_count : ""}</span></div>
    <div class="notes">${c.notes.map(n => `<span>${esc(n)}</span>`).join("")}<span style="background:none;color:var(--mut)">${esc(comps)}</span></div>
    <details><summary>transcrição</summary><pre>${esc(c.transcript || "(sem fala)")}</pre></details>
    ${ready ? `<div class="titles">${titles}</div>` : `<div class="titles"><b>${esc(c.chosen_title)}</b></div>`}
    <details class="nets-wrap"><summary>textos por rede (${Object.keys(c.networks).length})</summary><div class="nets">${nets}</div></details>
    <div class="links"><a href="/media/${c.id}/clip.mp4" download>⬇ clip.mp4</a>${c.has_music_video ? `<a href="/media/${c.id}/clip_youtube.mp4" download>⬇ versão YouTube (música)</a>` : ""}<span style="color:var(--mut)">${esc(c.music_note || "")}</span></div>
    <div class="acts">${acts}</div>
    <div class="panel reject"><div class="row"><b>motivo</b><select class="rr">${REJECT.map(r => `<option>${esc(r)}</option>`).join("")}</select><button class="no" data-a="reject-go">Confirmar rejeição</button></div></div>
    <div class="panel recut">
      <div class="row"><b>início</b><button data-d="s-2">−2s</button><button data-d="s-1">−1s</button><span class="val sv">0s</span><button data-d="s+1">+1s</button><button data-d="s+2">+2s</button></div>
      <div class="row"><b>fim</b><button data-d="e-2">−2s</button><button data-d="e-1">−1s</button><span class="val ev">0s</span><button data-d="e+1">+1s</button><button data-d="e+2">+2s</button></div>
      <div class="row"><button class="ok" data-a="recut-go">Re-renderizar com esse corte</button><span class="mut" style="font-size:12px;color:var(--mut)">o clipe novo aparece em Pendentes em ~1 min</span></div>
    </div>
  </article>`;
}

function render() {
  const el = $("#list");
  if (!clips.length) { el.innerHTML = `<div class="empty">${status === "ready" ? "Nada pendente. 🎉" : "Nenhum clipe aqui."}</div>`; return; }
  el.innerHTML = clips.map(card).join("");
  // pausa os outros vídeos quando um começa
  el.querySelectorAll("video").forEach(v => v.addEventListener("play", () => el.querySelectorAll("video").forEach(o => { if (o !== v) o.pause(); })));
}

function collect(art) {
  const sel = art.querySelector("input[type=radio]:checked");
  const idx = sel ? sel.value : 0;
  const title = (art.querySelector(`.titles input[type=text][data-i="${idx}"]`) || {}).value;
  const networks = {};
  art.querySelectorAll(".net").forEach(n => { networks[n.dataset.net] = { title: $(".nt", n).value, description: $(".nd", n).value }; });
  return { title, networks };
}

function removeCard(art, msg) {
  art.style.transition = "opacity .25s, transform .25s"; art.style.opacity = 0; art.style.transform = "translateX(40px)";
  setTimeout(() => { art.remove(); if (!$("#list .card")) load(); }, 260);
  toast(msg); api("/api/stats").then(renderStats).catch(() => {});
}

$("#list").addEventListener("click", async ev => {
  const btn = ev.target.closest("button"); if (!btn) return;
  const art = btn.closest(".card"); const id = art.dataset.id;
  if (btn.dataset.p) {
    const pid = art.dataset.pid; const p = posts.find(x => x.id == pid); const act = btn.dataset.p;
    if (act === "copy") {
      try { await navigator.clipboard.writeText(p.title + "\n\n" + p.caption); toast("texto copiado"); } catch { toast("não deu para copiar (precisa de HTTPS/localhost)"); }
      return;
    }
    if (act === "posted") { $(".urlrow", art).classList.toggle("on"); return; }
    if (busy) return;
    busy = true; btn.disabled = true;
    try {
      const body = act === "posted-go" ? { url: $(".purl", art).value.trim() || null } : {};
      const r = await api(`/api/posts/${pid}/${act === "posted-go" ? "posted" : act}`, body);
      const msg = { "posted-go": "✓ marcado como postado", now: r.post && r.post.url ? "🚀 publicado: " + r.post.url : (r.post && r.post.error ? "erro: " + r.post.error : "🚀 enviado"), skip: "pulado", retry: "↻ reagendado para já", reschedule: "⏱ reagendado" }[act];
      toast(msg, 3500);
      await load();
    } catch (e) { toast("erro: " + e.message, 4000); btn.disabled = false; }
    finally { busy = false; }
    return;
  }
  if (btn.dataset.copy) {
    const n = art.querySelector(`.net[data-net="${btn.dataset.copy}"]`);
    const txt = $(".nt", n).value + "\n\n" + $(".nd", n).value;
    try { await navigator.clipboard.writeText(txt); toast("copiado: " + NETS[btn.dataset.copy]); } catch { toast("não deu para copiar (precisa de HTTPS/localhost)"); }
    return;
  }
  if (btn.dataset.d) {
    const [which, sign, n] = [btn.dataset.d[0], btn.dataset.d[1], +btn.dataset.d.slice(2)];
    const v = $(which === "s" ? ".sv" : ".ev", art);
    const cur = parseFloat(v.dataset.v || 0) + (sign === "-" ? -n : n);
    v.dataset.v = cur; v.textContent = (cur > 0 ? "+" : "") + cur + "s";
    return;
  }
  const a = btn.dataset.a; if (!a || busy) return;
  try {
    if (a === "reject") { $(".panel.reject", art).classList.toggle("on"); $(".panel.recut", art).classList.remove("on"); return; }
    if (a === "recut-panel") { $(".panel.recut", art).classList.toggle("on"); $(".panel.reject", art).classList.remove("on"); return; }
    busy = true; btn.disabled = true;
    if (a === "approve") { await api(`/api/clips/${id}/approve`, collect(art)); removeCard(art, "✓ aprovado"); }
    else if (a === "reject-go") { await api(`/api/clips/${id}/reject`, { reason: $(".rr", art).value }); removeCard(art, "✗ rejeitado"); }
    else if (a === "reedit") { await api(`/api/clips/${id}/reedit`); removeCard(art, "↻ re-editando…"); }
    else if (a === "recut-go") {
      await api(`/api/clips/${id}/recut`, { start_delta: parseFloat($(".sv", art).dataset.v || 0), end_delta: parseFloat($(".ev", art).dataset.v || 0) });
      removeCard(art, "✂ recortando…");
    }
    else if (a === "restore") { await api(`/api/clips/${id}/restore`); removeCard(art, "↩ de volta à fila"); }
    else if (a === "posted") { await api(`/api/clips/${id}/posted`, { platforms: ["manual"] }); removeCard(art, "📤 marcado como postado"); }
  } catch (e) { toast("erro: " + e.message, 4000); btn.disabled = false; }
  finally { busy = false; }
});

$("#tabs").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  $("#tabs .on").classList.remove("on"); b.classList.add("on"); status = b.dataset.s; load();
});

// atalhos no PC: A aprova / R rejeita o primeiro card visível
document.addEventListener("keydown", ev => {
  if (ev.target.matches("input,textarea,select") || status !== "ready") return;
  const first = $("#list .card"); if (!first) return;
  if (ev.key === "a" || ev.key === "A") $('[data-a="approve"]', first)?.click();
  if (ev.key === "r" || ev.key === "R") { $('[data-a="reject"]', first)?.click(); }
});

load();
setInterval(() => { if (!busy) api("/api/stats").then(renderStats).catch(() => {}); }, 30000);
</script>
</body>
</html>
