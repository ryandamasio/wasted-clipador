<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120E24">
<title>WASTED · {{ profile }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night:#120E24; --dusk:#1B1536; --card:#221B45; --line:#33295F; --ink:#F4F0FF; --mute:#B3ACD3; --dim:#9890BF;
    --sun1:#FF2E88; --sun2:#FF8A3D; --star:#FFC43D; --ok:#2EE6C8; --ok-ink:#06201C; --no:#FF4D5E; --warn:#FFB454; --link:#8FB6FF;
    --display:"Bebas Neue","Impact","Arial Narrow",sans-serif; --body:"Rubik","Segoe UI",system-ui,sans-serif;
    --nav-h:64px;
  }
  * { box-sizing:border-box; }
  html { color-scheme:dark; }
  body { margin:0; background:var(--night); color:var(--ink); font:15px/1.5 var(--body); padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px); }
  a { color:var(--link); }
  button { cursor:pointer; border:0; border-radius:12px; padding:12px 14px; font:600 15px/1 var(--body); background:var(--line); color:var(--ink); }
  button:disabled { opacity:.4; cursor:default; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline:2px solid var(--sun2); outline-offset:2px; }
  input[type=text], textarea, select { width:100%; background:var(--night); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:9px 11px; font:inherit; }
  textarea { min-height:96px; resize:vertical; line-height:1.45; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

  /* ---------- topo: pôr do sol ---------- */
  .sky { background:linear-gradient(100deg, var(--sun1) 0%, var(--sun2) 55%, #FFD06B 100%); padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
  .brand { font-family:var(--display); font-size:44px; line-height:.9; letter-spacing:.04em; color:#1A0A1F; text-shadow:0 2px 0 rgba(255,255,255,.35); }
  .brand small { display:block; font:500 12px/1.3 var(--body); letter-spacing:0; color:#3A1530; text-shadow:none; margin-top:4px; }
  .pulse { font:500 12px/1.3 var(--body); color:#2A1226; text-align:right; max-width:50%; }
  .pulse b { display:block; font-family:var(--display); font-size:22px; letter-spacing:.03em; color:#1A0A1F; }

  main { max-width:620px; margin:0 auto; padding:14px 14px 0; }
  @media (min-width: 1000px) { main { max-width:1080px; } }

  /* ---------- navegação inferior ---------- */
  nav.bar { position:fixed; left:0; right:0; bottom:0; z-index:9; height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px)); padding-bottom:env(safe-area-inset-bottom,0px); background:rgba(18,14,36,.96); backdrop-filter:blur(10px); border-top:1px solid var(--line); display:flex; }
  nav.bar button { flex:1; background:none; border-radius:0; padding:8px 4px 6px; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--dim); font:400 12px/1 var(--body); position:relative; }
  nav.bar button span.t { font-family:var(--display); font-size:19px; letter-spacing:.06em; }
  nav.bar button.on { color:var(--ink); }
  nav.bar button.on::after { content:""; position:absolute; top:0; left:22%; right:22%; height:3px; border-radius:0 0 3px 3px; background:linear-gradient(90deg,var(--sun1),var(--sun2)); }
  nav.bar b { position:absolute; top:4px; left:calc(50% + 22px); min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--sun1); color:#fff; font:700 11px/18px var(--body); text-align:center; }
  nav.bar b:empty, nav.bar b.zero { display:none; }
  .seg { display:flex; gap:6px; margin-bottom:12px; overflow-x:auto; }
  .seg button { background:var(--dusk); color:var(--mute); padding:9px 14px; border-radius:999px; font-weight:500; white-space:nowrap; }
  .seg button.on { background:var(--ink); color:var(--night); }

  /* ---------- cartão de clipe ---------- */
  .card { background:var(--card); border-radius:20px; margin-bottom:18px; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .card .vid { position:relative; background:#000; }
  .card .vid video { display:block; width:100%; max-height:66vh; object-fit:contain; }
  .chips { position:absolute; top:10px; left:10px; right:10px; display:flex; gap:6px; flex-wrap:wrap; pointer-events:none; }
  .chip { background:rgba(18,14,36,.72); backdrop-filter:blur(6px); color:var(--ink); font:500 12px/1 var(--body); padding:7px 10px; border-radius:999px; }
  .chip.live { background:var(--sun1); color:#fff; }
  .body { padding:14px 14px 0; }
  .wanted { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .stars { font-size:22px; letter-spacing:2px; color:var(--star); line-height:1; }
  .stars .off { color:var(--line); }
  .score { font-family:var(--display); font-size:30px; letter-spacing:.04em; color:var(--ink); line-height:1; }
  .score small { font:500 12px/1 var(--body); color:var(--mute); letter-spacing:0; margin-left:4px; }
  .why { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .why span { background:var(--dusk); border-radius:999px; padding:5px 10px; font-size:13px; color:var(--ink); }
  .why span.dim { background:none; color:var(--dim); padding-left:2px; }
  details { border-top:1px solid var(--line); padding:9px 0; font-size:14px; color:var(--mute); }
  details summary { cursor:pointer; color:var(--ink); font-weight:500; list-style:none; display:flex; justify-content:space-between; }
  details summary::after { content:"+"; color:var(--dim); font-weight:700; }
  details[open] summary::after { content:"–"; }
  details pre { white-space:pre-wrap; word-break:break-word; margin:8px 0 0; font:inherit; color:var(--ink); }
  .titles { display:grid; gap:7px; margin:4px 0 10px; }
  .titles label { display:grid; grid-template-columns:22px 1fr; gap:8px; align-items:center; }
  .titles input[type=radio] { width:18px; height:18px; accent-color:var(--sun1); margin:0; }
  .titles input[type=text] { font-weight:500; }
  .net { border-top:1px solid var(--line); padding:10px 0; }
  .net h4 { margin:0 0 6px; font:500 14px/1 var(--body); display:flex; justify-content:space-between; align-items:center; }
  .net h4 button { font-size:12px; padding:6px 10px; background:var(--dusk); }
  .links { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; padding:8px 0 4px; }
  .note { color:var(--mute); font-size:13px; padding:4px 0 8px; }
  .acts { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px 14px 14px; }
  .acts .wide { grid-column:1 / -1; }
  button.ok { background:var(--ok); color:var(--ok-ink); font-size:17px; padding:15px 12px; }
  button.no { background:var(--no); color:#fff; font-size:17px; padding:15px 12px; }
  button.ghost { background:var(--dusk); color:var(--mute); font-weight:500; }
  button.ghost:hover { color:var(--ink); }
  .panel { padding:0 14px 14px; display:none; }
  .panel.on { display:block; }
  .row { display:flex; gap:6px; align-items:center; margin-bottom:8px; flex-wrap:wrap; }
  .row b { min-width:44px; color:var(--mute); font-weight:500; font-size:13px; }
  .row button { padding:9px 0; min-width:46px; background:var(--dusk); }
  .row .val { min-width:44px; text-align:center; font-family:var(--display); font-size:20px; letter-spacing:.04em; }
  .row .ok { padding:11px 14px; font-size:15px; }
  .hint { color:var(--dim); font-size:12px; }
  @media (min-width: 1000px) {
    .card { display:grid; grid-template-columns:340px 1fr; grid-template-rows:auto auto auto; }
    .card .vid { grid-row:1 / span 3; }
    .card .vid video { max-height:none; height:100%; max-height:760px; }
    .card .body { padding:18px 18px 0; }
    .card .acts { padding:12px 18px 18px; }
    .card .panel { padding:0 18px 18px; }
  }

  /* ---------- vazio / toast ---------- */
  .empty { text-align:center; padding:56px 16px; color:var(--mute); }
  .empty .big { font-family:var(--display); font-size:40px; letter-spacing:.05em; color:var(--ink); line-height:1; margin-bottom:8px; }
  .toast { position:fixed; left:50%; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px); transform:translateX(-50%); background:var(--ink); color:var(--night); padding:11px 16px; border-radius:12px; font-weight:500; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; z-index:10; }
  .toast.on { opacity:1; }

  /* ---------- agenda ---------- */
  .banner { background:var(--dusk); border-radius:14px; padding:12px 14px; font-size:13px; color:var(--mute); margin-bottom:14px; }
  .banner b { color:var(--ink); }
  .post { display:grid; grid-template-columns:76px 1fr; gap:12px; padding:14px; }
  .post img, .post .ph { width:76px; height:135px; object-fit:cover; border-radius:10px; background:var(--night); }
  .post h3 { margin:4px 0 2px; font:500 15px/1.3 var(--body); }
  .post .when { font-size:13px; color:var(--mute); }
  .post .when.due { color:var(--warn); font-weight:600; }
  .net-tag { display:inline-block; font-family:var(--display); font-size:15px; letter-spacing:.06em; padding:3px 9px 2px; border-radius:7px; color:#120E24; margin-right:6px; }
  .net-youtube { background:#FF6B6B; } .net-tiktok { background:#7CF2E4; } .net-instagram { background:#F5A3FF; } .net-kwai { background:#FFB15C; }
  .post .cap { margin-top:6px; font-size:13px; color:var(--mute); max-height:3.9em; overflow:hidden; white-space:pre-wrap; }
  .post .err { color:var(--no); font-size:13px; margin-top:4px; }
  .pacts { grid-column:1 / -1; display:flex; gap:8px; flex-wrap:wrap; }
  .pacts button { padding:10px 12px; font-size:14px; }
  .pacts a { text-decoration:none; }
  .urlrow { grid-column:1 / -1; display:none; gap:8px; }
  .urlrow.on { display:flex; }
  .urlrow input { flex:1; }

  /* ---------- painel ---------- */
  .kpis { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:16px; }
  @media (min-width: 620px) { .kpis { grid-template-columns:repeat(3, 1fr); } }
  .kpi { background:var(--card); border-radius:16px; padding:14px; }
  .kpi b { display:block; font-family:var(--display); font-size:34px; letter-spacing:.03em; line-height:1; margin-bottom:6px; }
  .kpi span { font-size:13px; color:var(--mute); line-height:1.3; display:block; }
  .kpi.warn b { color:var(--warn); } .kpi.bad b { color:var(--no); } .kpi.good b { color:var(--ok); }
  h2.sec { font-family:var(--display); font-size:22px; letter-spacing:.06em; margin:18px 0 8px; color:var(--ink); font-weight:400; }
  .tw { overflow-x:auto; background:var(--card); border-radius:16px; padding:6px 10px; margin-bottom:6px; }
  table.t { width:100%; border-collapse:collapse; font-size:14px; }
  table.t th, table.t td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.t tr:last-child td { border-bottom:0; }
  table.t th { color:var(--dim); font-weight:500; font-size:12px; }
  table.t td.n { font-family:var(--display); font-size:18px; letter-spacing:.03em; }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--sun1),var(--sun2)); }
  .foot { color:var(--dim); font-size:12px; text-align:center; padding:12px 0 4px; }
</style>
</head>
<body>
<header class="sky">
  <div class="brand">WASTED<small>{{ profile }} · fila de aprovação</small></div>
  <div class="pulse" id="pulse"><b id="pulse-n">–</b><span id="pulse-t">carregando</span></div>
</header>
<main id="list"><div class="empty">carregando…</div></main>
<nav class="bar" id="tabs">
  <button data-s="ready" class="on"><span class="t">Fila</span>pendentes<b id="n-ready"></b></button>
  <button data-s="agenda"><span class="t">Agenda</span>postar<b id="n-agenda"></b></button>
  <button data-s="hist"><span class="t">Histórico</span>decididos</button>
  <button data-s="painel"><span class="t">Painel</span>números</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const REJECT = {{ reject_reasons | tojson }};
const NETS = { youtube: "YouTube", tiktok: "TikTok", instagram: "Instagram", kwai: "Kwai" };
const COMP_NAMES = { chat: "chat", audio: "áudio", transcript: "fala", keywords: "GTA" };
let status = "ready", histStatus = "approved", clips = [], posts = [], publishInfo = {}, busy = false, lastStats = {};

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg, ms = 2200) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), ms); }
function stars(score) { const n = score < 50 ? 0 : score < 60 ? 1 : score < 70 ? 2 : score < 80 ? 3 : score < 90 ? 4 : 5; return "★".repeat(n) + `<span class="off">${"★".repeat(5 - n)}</span>`; }

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("erro " + r.status));
  return j;
}

async function load() {
  try {
    if (status === "agenda") { const j = await api(`/api/posts`); posts = j.posts; publishInfo = j.publish; renderPosts(); renderStats(j.stats); return; }
    if (status === "painel") { renderMetrics(await api(`/api/metrics?days=7`)); return; }
    const want = status === "hist" ? histStatus : "ready";
    const j = await api(`/api/clips?status=${want}`);
    clips = j.clips; render(); renderStats(j.stats);
  } catch (e) { $("#list").innerHTML = `<div class="empty"><div class="big">Ops</div>${esc(e.message)}</div>`; }
}

function renderStats(st) {
  lastStats = st;
  const c = st.counts || {};
  const set = (id, v) => { const el = $("#" + id); el.textContent = v || ""; el.classList.toggle("zero", !v); };
  set("n-ready", c.ready || 0);
  const ps = st.posts || {};
  set("n-agenda", (ps.scheduled || 0) + (ps.failed || 0) + (ps.posting || 0));
  const live = st.live_count;
  if (st.pending_moments) { $("#pulse-n").textContent = st.pending_moments; $("#pulse-t").textContent = "renderizando agora"; }
  else if (st.posts_due) { $("#pulse-n").textContent = st.posts_due; $("#pulse-t").textContent = "post(s) na hora de sair"; }
  else { $("#pulse-n").textContent = c.ready || 0; $("#pulse-t").textContent = (c.ready || 0) === 1 ? "clipe esperando você" : "clipes esperando você"; }
}

function card(c) {
  const ready = c.status === "ready";
  const titles = c.titles.map((t, i) => `<label><input type="radio" name="t${c.id}" value="${i}" ${t === c.chosen_title ? "checked" : ""}><input type="text" data-i="${i}" value="${esc(t)}"></label>`).join("");
  const nets = Object.entries(c.networks).map(([n, d]) => `
    <div class="net" data-net="${n}"><h4>${NETS[n] || n}<button class="ghost" data-copy="${n}">copiar</button></h4>
      <input type="text" class="nt" value="${esc(d.title)}" style="margin-bottom:6px">
      <textarea class="nd">${esc(d.description)}</textarea></div>`).join("");
  const comps = Object.entries(c.components).filter(([, v]) => v != null).map(([k, v]) => (COMP_NAMES[k] || k) + " " + Math.round(v * 100) + "%").join(" ");
  const acts = ready ? `
      <button class="ok" data-a="approve">Aprovar</button>
      <button class="no" data-a="reject">Rejeitar</button>
      <button class="ghost" data-a="recut-panel" ${c.media_available ? "" : "disabled title='gravação bruta já apagada'"}>Ajustar corte</button>
      <button class="ghost" data-a="reedit" ${c.media_available ? "" : "disabled"}>Gerar outra versão</button>`
    : c.status === "approved" ? `
      <button class="ok wide" data-a="posted">Marcar como postado</button>
      <button class="ghost" data-a="reject">Rejeitar</button><button class="ghost" data-a="restore">Voltar para a fila</button>`
    : c.status === "rejected" ? `<button class="ghost wide" data-a="restore">Voltar para a fila</button>`
    : `<span class="chip">${esc(c.status)}</span>`;
  const layout = c.render.layout === "split" ? "facecam + gameplay" : "gameplay";
  return `<article class="card" data-id="${c.id}">
    <div class="vid">
      <video controls playsinline preload="metadata" ${c.has_cover ? `poster="/media/${c.id}/cover.jpg"` : ""} src="/media/${c.id}/clip.mp4"></video>
      <div class="chips"><span class="chip">${esc(c.streamer_name)}</span><span class="chip">${c.duration}s</span><span class="chip">${c.when}</span>${c.recut_count ? `<span class="chip">recorte ${c.recut_count}</span>` : ""}</div>
    </div>
    <div class="body">
      <div class="wanted"><div class="stars" title="nota ${c.score}">${stars(c.score)}</div><div class="score">${c.score}<small>/100</small></div></div>
      <div class="why">${c.notes.map(n => `<span>${esc(n)}</span>`).join("")}<span class="dim">${esc(comps)}${c.render.zoom && c.render.zoom.length ? ` · zoom ×${c.render.zoom.length}` : ""} · ${layout}</span></div>
      <details><summary>O que ele disse</summary><pre>${esc(c.transcript || "(sem fala)")}</pre></details>
      ${ready ? `<details open><summary>Título</summary><div class="titles">${titles}</div></details>` : `<details><summary>Título escolhido</summary><pre>${esc(c.chosen_title)}</pre></details>`}
      <details><summary>Textos por rede (${Object.keys(c.networks).length})</summary>${nets}</details>
      <div class="links"><a href="/media/${c.id}/clip.mp4" download>Baixar clip.mp4</a>${c.has_music_video ? `<a href="/media/${c.id}/clip_youtube.mp4" download>Versão YouTube (com música)</a>` : ""}${c.has_long_video ? `<a href="/media/${c.id}/clip_long.mp4" download>Versão longa p/ TikTok (${c.long_seconds || "+60"} s)</a>` : ""}</div>
      <div class="note">${esc(c.music_note || "")}</div>
    </div>
    <div class="acts">${acts}</div>
    <div class="panel reject"><div class="row"><b>motivo</b><select class="rr">${REJECT.map(r => `<option>${esc(r)}</option>`).join("")}</select><button class="no" data-a="reject-go">Confirmar rejeição</button></div></div>
    <div class="panel recut">
      <div class="row"><b>início</b><button data-d="s-2">−2</button><button data-d="s-1">−1</button><span class="val sv">0s</span><button data-d="s+1">+1</button><button data-d="s+2">+2</button></div>
      <div class="row"><b>fim</b><button data-d="e-2">−2</button><button data-d="e-1">−1</button><span class="val ev">0s</span><button data-d="e+1">+1</button><button data-d="e+2">+2</button></div>
      <div class="row"><button class="ok" data-a="recut-go">Renderizar com esse corte</button><span class="hint">o clipe novo volta para a fila em cerca de 1 minuto</span></div>
    </div>
  </article>`;
}

function segControl() {
  const items = [["approved", "aprovados"], ["rejected", "rejeitados"], ["posted", "postados"], ["all", "tudo"]];
  return `<div class="seg" id="seg">${items.map(([k, l]) => `<button data-h="${k}" class="${k === histStatus ? "on" : ""}">${l}</button>`).join("")}</div>`;
}

function render() {
  const el = $("#list");
  const head = status === "hist" ? segControl() : "";
  if (!clips.length) {
    const msg = status === "ready" ? `<div class="big">Fila limpa</div>O próximo clipe aparece aqui assim que uma live esquentar.` : `<div class="big">Nada aqui</div>Nenhum clipe nessa lista ainda.`;
    el.innerHTML = head + `<div class="empty">${msg}</div>`; return;
  }
  el.innerHTML = head + clips.map(card).join("");
  el.querySelectorAll("video").forEach(v => v.addEventListener("play", () => el.querySelectorAll("video").forEach(o => { if (o !== v) o.pause(); })));
}

function collect(art) {
  const sel = art.querySelector("input[type=radio]:checked");
  const idx = sel ? sel.value : 0;
  const title = (art.querySelector(`.titles input[type=text][data-i="${idx}"]`) || {}).value;
  const networks = {};
  art.querySelectorAll(".net").forEach(n => { networks[n.dataset.net] = { title: $(".nt", n).value, description: $(".nd", n).value }; });
  return { title, networks };
}

function removeCard(art, msg) {
  art.style.transition = "opacity .25s, transform .25s"; art.style.opacity = 0; art.style.transform = "translateX(40px)";
  setTimeout(() => { art.remove(); if (!$("#list .card")) load(); }, 260);
  toast(msg); api("/api/stats").then(renderStats).catch(() => {});
}

/* ---------- agenda ---------- */
function postCard(p) {
  const manual = p.publisher === "manual";
  const acts = [];
  if (p.status === "scheduled" || p.status === "posting") {
    acts.push(manual ? `<button class="ok" data-p="posted">Já postei</button>` : `<button class="ok" data-p="now">Postar agora</button>`);
    acts.push(`<button class="ghost" data-p="reschedule">Reagendar</button>`, `<button class="ghost" data-p="skip">Pular</button>`);
  } else if (p.status === "failed") {
    acts.push(`<button class="ok" data-p="retry">Tentar de novo</button>`, `<button class="ghost" data-p="posted">Marcar postado</button>`, `<button class="ghost" data-p="skip">Pular</button>`);
  } else if (p.status === "processing") {
    acts.push(`<span class="chip">processando na plataforma</span>`);
  }
  return `<article class="card post-card" data-pid="${p.id}"><div class="post">
    ${p.has_cover ? `<img src="/media/${p.clip_id}/cover.jpg" alt="">` : `<div class="ph"></div>`}
    <div>
      <div><span class="net-tag net-${p.platform}">${NETS[p.platform] || p.platform}</span><span class="stars" style="font-size:15px">${stars(p.score)}</span></div>
      <h3>${esc(p.title)}</h3>
      <div class="when ${p.due ? "due" : ""}">${p.due ? "Agora: " : ""}${esc(p.when)} — ${esc(p.streamer_name)}${manual ? "" : " — automático"}${p.attempts > 1 ? ` — tentativa ${p.attempts}` : ""}</div>
      <div class="cap">${esc(p.caption)}</div>
      ${p.error ? `<div class="err">${esc(p.error)}</div>` : ""}
      ${p.url ? `<div><a href="${esc(p.url)}" target="_blank" style="font-size:13px">${esc(p.url)}</a></div>` : ""}
    </div>
    <div class="pacts">
      <button class="ghost" data-p="copy">Copiar texto</button>
      <a href="/media/${p.clip_id}/${p.video_name}" download><button class="ghost">Baixar vídeo</button></a>
      ${acts.join("")}
    </div>
    <div class="urlrow"><input type="text" class="purl" placeholder="link do post (opcional)"><button class="ok" data-p="posted-go">Confirmar</button></div>
  </div></article>`;
}

function renderPosts() {
  const el = $("#list");
  const auto = publishInfo.mode === "auto";
  const nets = Object.entries(publishInfo.networks || {}).map(([n, i]) => `${NETS[n] || n}: ${i.manual ? "você posta" : (i.configured ? "automático" : "API sem credencial")}`).join(", ");
  const banner = `<div class="banner"><b>${auto ? "Publicação automática" : "Você posta, eu organizo"}</b> — ${esc(nets)}.<br>Janelas de postagem: ${(publishInfo.windows || []).join(", ")}. ${auto ? "" : "Copie o texto, poste no app da rede no horário sugerido e toque em Já postei."}</div>`;
  if (!posts.length) { el.innerHTML = banner + `<div class="empty"><div class="big">Agenda vazia</div>Aprove clipes na Fila para eles entrarem aqui com dia e hora.</div>`; return; }
  el.innerHTML = banner + posts.map(postCard).join("");
}

/* ---------- painel ---------- */
function renderMetrics(m) {
  const h = m.health, c = m.counts || {};
  const total = Object.values(c).reduce((a, b) => a + b, 0);
  const decided = (c.approved || 0) + (c.posted || 0) + (c.rejected || 0);
  const rate = decided ? Math.round(100 * ((c.approved || 0) + (c.posted || 0)) / decided) : null;
  const kpi = (v, label, cls = "") => `<div class="kpi ${cls}"><b>${v}</b><span>${label}</span></div>`;
  const backlog = (h.backlog.to_detect || 0) + (h.backlog.detecting || 0);
  let html = `<div class="kpis">
    ${kpi(h.live.length, h.live.length ? "ao vivo agora: " + h.live.map(l => l.streamer).join(", ") : "nenhuma live agora", h.live.length ? "good" : "")}
    ${kpi(total, "clipes produzidos")}
    ${kpi(rate === null ? "–" : rate + "%", "aprovados entre " + decided + " decididos", rate === null ? "" : rate >= 60 ? "good" : "warn")}
    ${kpi(m.latency && m.latency.n ? m.latency.avg_min + " min" : "–", "do momento ao clipe pronto", m.latency && m.latency.avg_min > 10 ? "warn" : "good")}
    ${kpi(backlog, "segmentos esperando o Whisper", backlog > 3 ? "warn" : "")}
    ${kpi((h.pending.new || 0) + (h.pending.waiting || 0) + (h.pending.editing || 0), "momentos para renderizar")}
    ${kpi(h.disk_free_gb + " GB", "livres no disco, " + h.recordings_gb + " GB de gravações", h.disk_free_gb < 40 ? "bad" : "")}
    ${kpi(h.gpu ? h.gpu.util + "%" : "–", h.gpu ? `GPU em uso, ${h.gpu.mem_used} de ${h.gpu.mem_total} MB, ${h.gpu.temp}°C` : "GPU indisponível")}
    ${kpi(h.publish_mode === "auto" ? "auto" : "manual", "publicação; plano B " + (h.plan_b ? "ligado" : "desligado"))}
  </div>`;
  html += `<h2 class="sec">Últimos ${m.days} dias</h2><div class="tw"><table class="t"><tr><th>dia</th><th>clipes</th><th>aprovados</th><th>rejeitados</th><th>postados</th></tr>`;
  html += (m.per_day || []).map(d => `<tr><td>${d.day}</td><td class="n">${d.clips}</td><td class="n">${d.approved || 0}</td><td class="n">${d.rejected || 0}</td><td class="n">${d.posted || 0}</td></tr>`).join("") || `<tr><td colspan="5" style="color:var(--dim)">sem clipes no período</td></tr>`;
  html += `</table></div>`;
  html += `<h2 class="sec">Por streamer</h2><div class="tw"><table class="t"><tr><th>streamer</th><th>lives</th><th>segmentos</th><th>momentos</th><th>clipes</th><th>aprovados</th><th>rejeitados</th><th>nota média</th></tr>`;
  html += (m.per_streamer || []).map(s => `<tr><td>${esc(s.streamer)}</td><td class="n">${s.streams}</td><td class="n">${s.segments}</td><td class="n">${s.moments}</td><td class="n">${s.clips}</td><td class="n">${s.approved || 0}</td><td class="n">${s.rejected || 0}</td><td class="n">${s.avg_score || "–"}</td></tr>`).join("");
  html += `</table></div>`;
  html += `<h2 class="sec">Suas decisões por nota</h2><div class="tw"><table class="t"><tr><th>faixa</th><th>aprovados</th><th>rejeitados</th><th>recortes</th><th>taxa</th></tr>`;
  html += (m.reviews || []).map(r => { const d = r.approved + r.rejected; const pct = d ? Math.round(100 * r.approved / d) : 0;
    return `<tr><td>${r.band}</td><td class="n">${r.approved}</td><td class="n">${r.rejected}</td><td class="n">${r.recut}</td><td style="min-width:130px"><div class="bar"><i style="width:${pct}%"></i></div>${d ? pct + "%" : ""}</td></tr>`; }).join("") || `<tr><td colspan="5" style="color:var(--dim)">ainda sem decisões: aprove ou rejeite clipes na Fila</td></tr>`;
  html += `</table></div>`;
  html += `<h2 class="sec">Posts</h2><div class="tw"><table class="t"><tr><th>rede</th><th>agendados</th><th>postados</th><th>falhos</th><th>views</th><th>likes</th></tr>`;
  html += (m.posts || []).map(p => { const v = (m.views || {})[p.platform] || {}; return `<tr><td>${NETS[p.platform] || p.platform}</td><td class="n">${p.scheduled || 0}</td><td class="n">${p.posted || 0}</td><td class="n">${p.failed || 0}</td><td class="n">${v.views ?? "–"}</td><td class="n">${v.likes ?? "–"}</td></tr>`; }).join("") || `<tr><td colspan="6" style="color:var(--dim)">nenhum post ainda</td></tr>`;
  html += `</table></div><div class="foot">${h.tunnel_url ? `acesso pela internet: <a href="${esc(h.tunnel_url)}">${esc(h.tunnel_url)}</a> (senha do .env) · ` : ""}último backup do banco: ${h.last_backup || "nenhum"} · atualizado ${m.generated_at}</div>`;
  $("#list").innerHTML = html;
}

/* ---------- eventos ---------- */
$("#list").addEventListener("click", async ev => {
  const btn = ev.target.closest("button"); if (!btn) return;
  if (btn.dataset.h) { histStatus = btn.dataset.h; load(); return; }
  const art = btn.closest(".card"); if (!art) return;
  const id = art.dataset.id;
  if (btn.dataset.p) {
    const pid = art.dataset.pid; const p = posts.find(x => x.id == pid); const act = btn.dataset.p;
    if (act === "copy") { try { await navigator.clipboard.writeText(p.title + "\n\n" + p.caption); toast("Texto copiado"); } catch { toast("Não deu para copiar aqui (abra em localhost ou HTTPS)"); } return; }
    if (act === "posted") { $(".urlrow", art).classList.toggle("on"); return; }
    if (busy) return;
    busy = true; btn.disabled = true;
    try {
      const body = act === "posted-go" ? { url: $(".purl", art).value.trim() || null } : {};
      const r = await api(`/api/posts/${pid}/${act === "posted-go" ? "posted" : act}`, body);
      const msg = { "posted-go": "Marcado como postado", now: r.post && r.post.url ? "Publicado: " + r.post.url : (r.post && r.post.error ? "Erro: " + r.post.error : "Enviado"), skip: "Pulado", retry: "Vai tentar de novo agora", reschedule: "Reagendado" }[act];
      toast(msg, 3500); await load();
    } catch (e) { toast("Erro: " + e.message, 4000); btn.disabled = false; }
    finally { busy = false; }
    return;
  }
  if (btn.dataset.copy) {
    const n = art.querySelector(`.net[data-net="${btn.dataset.copy}"]`);
    try { await navigator.clipboard.writeText($(".nt", n).value + "\n\n" + $(".nd", n).value); toast("Copiado: " + NETS[btn.dataset.copy]); } catch { toast("Não deu para copiar aqui (abra em localhost ou HTTPS)"); }
    return;
  }
  if (btn.dataset.d) {
    const [which, sign, n] = [btn.dataset.d[0], btn.dataset.d[1], +btn.dataset.d.slice(2)];
    const v = $(which === "s" ? ".sv" : ".ev", art);
    const cur = parseFloat(v.dataset.v || 0) + (sign === "-" ? -n : n);
    v.dataset.v = cur; v.textContent = (cur > 0 ? "+" : "") + cur + "s";
    return;
  }
  const a = btn.dataset.a; if (!a || busy) return;
  try {
    if (a === "reject") { $(".panel.reject", art).classList.toggle("on"); $(".panel.recut", art).classList.remove("on"); return; }
    if (a === "recut-panel") { $(".panel.recut", art).classList.toggle("on"); $(".panel.reject", art).classList.remove("on"); return; }
    busy = true; btn.disabled = true;
    if (a === "approve") { await api(`/api/clips/${id}/approve`, collect(art)); removeCard(art, "Aprovado e agendado"); }
    else if (a === "reject-go") { await api(`/api/clips/${id}/reject`, { reason: $(".rr", art).value }); removeCard(art, "Rejeitado"); }
    else if (a === "reedit") { await api(`/api/clips/${id}/reedit`); removeCard(art, "Gerando outra versão"); }
    else if (a === "recut-go") { await api(`/api/clips/${id}/recut`, { start_delta: parseFloat($(".sv", art).dataset.v || 0), end_delta: parseFloat($(".ev", art).dataset.v || 0) }); removeCard(art, "Recortando"); }
    else if (a === "restore") { await api(`/api/clips/${id}/restore`); removeCard(art, "De volta à fila"); }
    else if (a === "posted") { await api(`/api/clips/${id}/posted`, { platforms: ["manual"] }); removeCard(art, "Marcado como postado"); }
  } catch (e) { toast("Erro: " + e.message, 4000); btn.disabled = false; }
  finally { busy = false; }
});

$("#tabs").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  $("#tabs .on").classList.remove("on"); b.classList.add("on"); status = b.dataset.s; window.scrollTo(0, 0); load();
});

document.addEventListener("keydown", ev => {
  if (ev.target.matches("input,textarea,select") || status !== "ready") return;
  const first = $("#list .card"); if (!first) return;
  if (ev.key === "a" || ev.key === "A") $('[data-a="approve"]', first)?.click();
  if (ev.key === "r" || ev.key === "R") $('[data-a="reject"]', first)?.click();
});

load();
setInterval(() => { if (!busy) api("/api/stats").then(renderStats).catch(() => {}); }, 30000);
</script>
</body>
</html>
